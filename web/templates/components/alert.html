{{define "alert-info"}}
<div id="info-alert-{{.ID}}" class="relative mb-4 rounded-md border border-zinc-700 bg-zinc-900 px-3 py-2.5 {{.Class}}" style="display: none;">
  <div class="flex items-center gap-2.5 pr-8">
    <svg class="h-4 w-4 shrink-0 text-slate-500" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
    </svg>
    <div class="min-w-0 flex-1 text-sm text-slate-400">
      {{if .Title}}<span class="mr-1 font-medium text-slate-200">{{.Title}}:</span>{{end}}
      <span>{{safeHTML .Content}}</span>
    </div>
    <button type="button" aria-label="Dismiss" data-dismiss-info-alert="{{.ID}}" class="absolute right-2 top-1.5 rounded p-1 text-slate-500 hover:bg-zinc-800 hover:text-slate-200">&times;</button>
  </div>
</div>
{{end}}
