{{define "components/footer.html"}}
<div class="app-footer-space mt-auto pt-4">
<footer class="app-footer border-t text-xs text-slate-500">

      <a href="https://www.buymeacoffee.com/mahcks" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-yellow-400 hover:text-yellow-300">

      </a>
