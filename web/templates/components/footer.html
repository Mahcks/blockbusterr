    <div class="flex flex-col items-center gap-1 text-xs md:flex-row md:gap-4">
      <span>
        Version: <span class="font-semibold text-slate-200">{{.Version}}</span>
        {{- if or (contains .Version "beta") (contains .Version "alpha") -}}
        <span class="ml-1 text-xs text-yellow-400">💛 Thanks for testing!</span>
        {{- end}}
        <span class="mx-2">|</span>
        Latest: <a id="latest-version" class="font-semibold text-blue-300 underline hover:text-blue-400" href="#" target="_blank" rel="noopener">...</a>
      </span>
      <span class="mt-1 md:mt-0">&copy; 2026 Blockbusterr &mdash; Credits: <a href="https://github.com/mahcks/blockbusterr" class="underline hover:text-blue-400">mahcks & contributors</a></span>
    </div>
  </div>
</footer>
<script>
// Fetch latest version from GitHub
fetch('https://api.github.com/repos/mahcks/blockbusterr/releases/latest')
  .then(r => r.json())
  .then(data => {
    console.log(data);
    if (data.tag_name) {
      var latest = document.getElementById('latest-version');
      latest.textContent = data.tag_name;
      if (data.html_url) {
        latest.href = data.html_url;
      }
    }
  })
  .catch(() => {
    document.getElementById('latest-version').textContent = 'unavailable';
  });

</script>
{{end}}
