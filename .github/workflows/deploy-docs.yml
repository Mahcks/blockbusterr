name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.5.2
          path: v1

      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          path: v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'
          cache-dependency-path: |
            v1/docs/package-lock.json
            v2/docs/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          npm ci --prefix v1/docs
          npm ci --prefix v2/docs

      - name: Build v1 and v2 with Astro
        run: |
          cp v2/docs/src/components/VersionedSiteTitle.astro v1/docs/src/components/VersionedSiteTitle.astro
          npm run build --prefix v1/docs -- --base /v1/
          node v2/docs/scripts/archive-v1.mjs v1/docs/dist
          npm run build --prefix v2/docs
          mkdir -p site/v1
          cp -a v2/docs/dist/. site/
          cp -a v1/docs/dist/. site/v1/
          DOCS_BASE=/v2/ npm run build --prefix v2/docs
          npm run check:v2-links --prefix v2/docs
          mkdir -p site/v2
          cp -a v2/docs/dist/. site/v2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
