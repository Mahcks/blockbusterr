name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main, release/v2.0.0]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1

      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          path: v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'
          cache-dependency-path: |
            v1/docs/package-lock.json
            v2/docs/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          npm ci --prefix v1/docs
          npm ci --prefix v2/docs

      - name: Build v1 and v2 with Astro
        run: |
          npm run build --prefix v1/docs
          DOCS_BASE=/v2/ npm run build --prefix v2/docs
          npm run check:v2-links --prefix v2/docs
          mkdir -p v1/docs/dist/v2
          cp -a v2/docs/dist/. v1/docs/dist/v2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./v1/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
