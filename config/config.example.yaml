# Blockbusterr v2 example configuration
# Copy to config.yaml, then use the Settings, Jobs, and Rules pages.
# Every example job is disabled so the first start cannot deliver content.

version: "2.0.0"

# Configure at least one discovery provider.
trakt:
  client_id: ""
  client_secret: ""
  # User authorization is completed from Settings; tokens are stored here automatically.

tmdb:
  api_key: ""
  # User authorization is completed from Settings; the session is stored here automatically.

simkl:
  client_id: ""

# Optional list and watchlist discovery provider.
mdblist:
  api_key: ""

# Experimental: scrapes public pages and may stop working without notice.
letterboxd:
  experimental_scraping: false

# Direct delivery targets. Configure Radarr for movies and Sonarr for shows.
radarr:
  url: "" # Example: http://radarr:7878
  api_key: ""
  quality_profile: 0
  root_folder: ""
  minimum_availability: released
  monitor: movieOnly

sonarr:
  url: "" # Example: http://sonarr:8989
  api_key: ""
  quality_profile: 0
  root_folder: ""
  monitor: all

# Optional alternative delivery target for request-based workflows.
jellyseerr:
  url: "" # Jellyseerr or Seerr; example: http://jellyseerr:5055
  api_key: ""
  user_id: ""
  request_credentials:
    email: ""
    password: ""

scoring:
  enabled: true
  rating_weight: 0.6
  popularity_weight: 0.3
  recency_weight: 0.1
  rating_scale: 10
  popularity_metric: votes
  recency_days: 365

jobs:
  sync_interval: 24h
  mode: direct # direct or jellyseerr
  global_limit_movies: 0 # Successful deliveries in the rolling period; zero is unlimited
  global_limit_shows: 0
  global_period: daily # daily (24h), weekly (7d), or monthly (30d)
  list:
    - id: trending-movies
      name: Trending Movies
      enabled: false
      type: trending
      source: tmdb
      media: movie
      limit: 20
      delivery_limit: 0 # Successful additions or requests per run; zero is unlimited
      rule_set_id: default-movies

    - id: trending-shows
      name: Trending Shows
      enabled: false
      type: trending
      source: tmdb
      media: show
      limit: 20
      delivery_limit: 0
      rule_set_id: default-shows

# Rule sets are reusable and media-specific. Assign one to each job.
rule_sets:
  - id: default-movies
    name: Default Movies
    media: movie
    revision: 1
    movies:
      allowed_countries: []
      allowed_languages: []
      blacklisted_countries: []
      blacklisted_languages: []
      blacklisted_genres: []
      blacklisted_keywords: []
      required_genres: []
      required_keywords: []
      allow_countries: []
      allow_languages: []
      allow_genres: []
      allow_keywords: []
      allow_min_rating: 0
      blacklisted_tmdb_ids: []
      blacklisted_min_runtime: 0
      blacklisted_max_runtime: 0
      blacklisted_min_year: 0
      blacklisted_max_year: 0
      min_rating: 0
      min_votes: 0

  - id: default-shows
    name: Default Shows
    media: show
    revision: 1
    shows:
      allowed_countries: []
      allowed_languages: []
      blacklisted_countries: []
      blacklisted_languages: []
      blacklisted_genres: []
      blacklisted_keywords: []
      blacklisted_networks: []
      required_genres: []
      required_keywords: []
      required_networks: []
      allow_countries: []
      allow_languages: []
      allow_genres: []
      allow_keywords: []
      allow_networks: []
      allow_min_rating: 0
      blacklisted_tvdb_ids: []
      blacklisted_min_runtime: 0
      blacklisted_max_runtime: 0
      blacklisted_min_year: 0
      blacklisted_max_year: 0
      min_rating: 0
      min_votes: 0

# Universal exceptions take precedence over assigned rule sets.
title_exceptions:
  allowed_movie_tmdb_ids: []
  blocked_movie_tmdb_ids: []
  allowed_show_tvdb_ids: []
  blocked_show_tvdb_ids: []
